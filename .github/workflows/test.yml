name: "Test"

# @see https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#onpushpull_requestbranchestags
on: [push, pull_request]

jobs:
  utest:
    name: actions-test-utest-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, target: linux-debug-utest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: linux-debug-utest }
          - { name: darwin-arm64, os: macos-latest, target: darwin-debug-utest }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      ################################################################
      # Tests
      - name: Run ST utest
        run: make ${{ matrix.target }} && ./obj/st_utest

  coverage:
    name: actions-test-coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      ################################################################
      # Tests
      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Run ST utest with coverage
        run: make linux-debug-gcov && ./obj/st_utest
      - name: Generate coverage report
        run: |
          # Report the library only; the utest and gtest objects are built from utest/.
          rm -f obj/st_utest*.gc* obj/gtest-all.gc*
          gcovr --root . --xml coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true

  # Native Windows with MSVC, built with GNU make from Git Bash. st_utest runs with
  # ST_EVENTSYS_DEFAULT and ST_EVENTSYS_ALT, and skips the few tests that Windows TCP
  # behavior cannot pass, in the test code itself.
  windows:
    name: actions-test-build-win64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      ################################################################
      # Build
      - name: Setup MSVC environment
        shell: pwsh
        run: |
          # Pass the vcvars64.bat environment to the next steps: INCLUDE, LIB, LIBPATH,
          # and only the PATH directories that vcvars64.bat adds.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio with the MSVC x64 tools" }
          $vars = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          $old = $env:PATH -split ';'
          foreach ($line in $vars) {
            if ($line -match '^(INCLUDE|LIB|LIBPATH)=(.*)$') {
              [IO.File]::AppendAllText($env:GITHUB_ENV, "$($Matches[1])=$($Matches[2])`n")
            } elseif ($line -match '^PATH=(.*)$') {
              foreach ($dir in $Matches[1] -split ';') {
                if ($dir -and $old -notcontains $dir) { [IO.File]::AppendAllText($env:GITHUB_PATH, "$dir`n") }
              }
            }
          }
      - name: Build ST and utest with MSVC
        shell: bash
        run: |
          command -v make >/dev/null || choco install make --no-progress -y
          command -v make cl ml64 lib
          make win64-debug-utest
          test -f obj/st_utest.exe

      ################################################################
      # Tests
      # Both event systems are WSAPoll on Windows; run the whole suite with each.
      - name: Run ST utest with ST_EVENTSYS_DEFAULT
        shell: bash
        timeout-minutes: 10
        env:
          ST_UTEST_EVENTSYS: default
        run: ./obj/st_utest.exe
      - name: Run ST utest with ST_EVENTSYS_ALT
        shell: bash
        timeout-minutes: 10
        env:
          ST_UTEST_EVENTSYS: alt
        run: ./obj/st_utest.exe

      ################################################################
      # Build
      - name: Build optimized ST with MSVC
        shell: bash
        run: |
          make win64-optimized
          test -f obj/libst.a

  # The single check to require for merging. It runs even when a needed job
  # fails, because a skipped required check counts as passed.
  final:
    name: actions-test-final
    runs-on: ubuntu-24.04
    needs: [utest, coverage, windows]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          echo "utest: ${{ needs.utest.result }}, coverage: ${{ needs.coverage.result }}, windows: ${{ needs.windows.result }}"
          test "${{ needs.utest.result }}" = success
          test "${{ needs.coverage.result }}" = success
          test "${{ needs.windows.result }}" = success
